<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#185b3c">
  <title>리니지M 컬렉션 검색</title>
  <style>

:root {
  --ink: #172019;
  --muted: #657067;
  --paper: #f6f7f2;
  --panel: #ffffff;
  --line: #dfe5dc;
  --green: #185b3c;
  --green-dark: #0f432c;
  --green-soft: #e7f1e9;
  --gold: #e7b947;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  overscroll-behavior: none;
}

button, input { font: inherit; }

.app-shell {
  height: 100dvh;
  min-height: 480px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-panel {
  flex: 0 0 auto;
  padding: 18px clamp(14px, 3vw, 34px) 12px;
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(31, 56, 40, 0.08);
  z-index: 10;
}

.title-row, .search-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.eyebrow {
  margin: 0 0 2px;
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.13em;
}

h1 {
  margin: 0;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: clamp(22px, 4vw, 34px);
  line-height: 1.15;
  letter-spacing: -0.04em;
}

.total-badge {
  flex: 0 0 auto;
  padding: 7px 10px;
  border: 1px solid #c9d4c9;
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.tabs {
  display: flex;
  gap: 7px;
  margin: 14px 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  min-width: 88px;
  padding: 10px 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid #cfd8cf;
  border-radius: 12px;
  background: #fff;
  color: #4f5c52;
  font-weight: 800;
  cursor: pointer;
  transition: 160ms ease;
}

.tab span {
  padding: 2px 6px;
  border-radius: 999px;
  background: #eef1ed;
  font-size: 10px;
}

.tab.active {
  border-color: var(--green);
  background: var(--green);
  color: #fff;
  box-shadow: 0 5px 16px rgba(24, 91, 60, 0.2);
}

.tab.active span { background: rgba(255, 255, 255, 0.18); }

.search-box {
  height: 46px;
  flex: 1 1 520px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  border: 2px solid var(--green);
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 4px 16px rgba(23, 70, 47, 0.08);
}

.search-box > span {
  color: var(--green);
  font-size: 27px;
  line-height: 1;
  transform: rotate(-15deg);
}

.search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
}

.search-box input::placeholder { color: #919b93; }

.search-box button {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: #eef2ed;
  color: #586259;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.result-count {
  flex: 0 0 auto;
  min-width: 98px;
  text-align: right;
  color: var(--muted);
  font-size: 13px;
}

.result-count strong { color: var(--green); font-size: 20px; }

.drag-hint {
  margin: 7px 2px 0;
  color: var(--muted);
  font-size: 11px;
}

.table-scroller {
  flex: 1 1 auto;
  min-height: 0;
  margin: 12px clamp(10px, 2vw, 24px) 14px;
  overflow: auto;
  touch-action: pan-x pan-y;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  cursor: grab;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: 0 12px 32px rgba(25, 49, 33, 0.08);
}

.table-scroller.dragging { cursor: grabbing; user-select: none; }

table {
  width: max-content;
  min-width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

th, td {
  min-width: 170px;
  max-width: 230px;
  padding: 12px 14px;
  text-align: left;
  vertical-align: middle;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  white-space: normal;
  word-break: keep-all;
}

th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--green-dark);
  color: #fff;
  font-size: 12px;
  letter-spacing: -0.02em;
}

tbody tr:nth-child(even) td { background: #f9faf7; }
tbody tr:hover td { background: #f0f6ef; }

.sticky-name {
  position: sticky;
  left: 0;
  min-width: 220px;
  max-width: 270px;
  z-index: 2;
  box-shadow: 8px 0 14px -14px rgba(13, 37, 23, 0.8);
}

th.sticky-name { z-index: 5; background: #0b3624; }
.name-cell { background: #fff; font-weight: 800; color: #172a1d; }
tbody tr:nth-child(even) .name-cell { background: #f4f7f2; }
.effect-col, .effect-cell { min-width: 220px; }
.effect-cell { background: #fff; color: #0d5535; font-weight: 750; }
tbody tr:nth-child(even) .effect-cell { background: #f4f7f2; }

.state-message {
  height: 100%;
  min-height: 240px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-weight: 700;
}

.state-message.error { color: #a23e35; }

.empty-result {
  padding: 42px;
  text-align: center;
  color: var(--muted);
}

@media (max-width: 640px) {
  .top-panel { padding: 12px 12px 9px; }
  .eyebrow { font-size: 9px; }
  .total-badge { display: none; }
  .tabs { margin: 10px 0 9px; gap: 6px; }
  .tab { min-width: 78px; padding: 8px 10px; border-radius: 10px; font-size: 13px; }
  .search-row { gap: 8px; }
  .search-box { height: 42px; border-radius: 11px; }
  .search-box input { font-size: 14px; }
  .result-count { min-width: 70px; font-size: 11px; }
  .result-count strong { display: block; font-size: 17px; line-height: 1; }
  .drag-hint { margin-top: 5px; }
  .table-scroller { margin: 8px 7px 7px; border-radius: 11px; }
  table { table-layout: fixed; }
  th, td {
    width: 90px;
    min-width: 90px;
    max-width: 90px;
    padding: 10px 9px;
    font-size: 12px;
    line-height: 1.35;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .sticky-name {
    width: 90px;
    min-width: 90px;
    max-width: 90px;
    word-break: keep-all;
  }
  .effect-col, .effect-cell {
    width: 90px;
    min-width: 90px;
    max-width: 90px;
    word-break: keep-all;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
  <main class="app-shell">
    <header class="top-panel">
      <div class="title-row">
        <div><p class="eyebrow">LINEAGE M COLLECTION</p><h1>리니지M 컬렉션 검색</h1></div>
        <span class="total-badge" id="totalBadge"></span>
      </div>
      <nav class="tabs" id="tabs" aria-label="컬렉션 종류"></nav>
      <div class="search-row">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" placeholder="이름, 효과, 등록 대상 검색" aria-label="컬렉션 검색" autocomplete="off">
          <button id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
        </label>
        <div class="result-count" aria-live="polite"><strong id="resultCount">0</strong><span id="allCount"></span></div>
      </div>
      <p class="drag-hint">표를 손가락으로 상하좌우 밀어서 이동하세요.</p>
    </header>
    <section class="table-scroller" id="scroller" aria-label="컬렉션 표"></section>
  </main>

egory":"성물","classification":"","name":"에스카로스의 정점","effect":"대미지 리덕션 무시 +1","items":["로웬델의 왕관","나그바스의 지팡이"]},{"category":"성물","classification":"","name":"전설의 왕관","effect":"대미지 리덕션 +1","items":["로웬델의 왕관","포세이돈의 왕관"]},{"category":"성물","classification":"","name":"여왕님을 지켜라","effect":"물리 방어력 (AC) -1","items":["로웬델의 왕관","듀페리온의 처형 도끼","욥니르의 심판 철퇴"]},{"category":"성물","classification":"","name":"2연패","effect":"근거리 대미지 +1 원거리 대미지 +1 마법 대미지 +1","items":["폴의 낚싯대","자이언트 웜의 독주머니"]},{"category":"성물","classification":"","name":"자연산 비늘..","effect":"WIS +1","items":["폴의 낚싯대","죽음의 비늘"]},{"category":"성물","classification":"","name":"작살 써도 되나요?","effect":"마법 방어력 (MR) +2","items":["폴의 낚싯대","이프리트의 창"]},{"category":"성물","classification":"","name":"낚시 일지","effect":"경험치 획득량 증가 +2%","items":["폴의 낚싯대","싱클레어의 노트"]}]};
  const TAB_NAMES=["아이템","변신","인형","성물"];
  let activeTab="아이템";
  const tabsEl=document.getElementById("tabs");
  const searchEl=document.getElementById("search");
  const clearEl=document.getElementById("clear");
  const resultEl=document.getElementById("resultCount");
  const allEl=document.getElementById("allCount");
  const scroller=document.getElementById("scroller");
  const total=TAB_NAMES.reduce((sum,name)=>sum+DATA[name].length,0);
  document.getElementById("totalBadge").textContent=`총 ${total.toLocaleString()}개`;

  function renderTabs(){
    tabsEl.replaceChildren();
    TAB_NAMES.forEach(name=>{
      const button=document.createElement("button");
      button.type="button";
      button.className=name===activeTab?"tab active":"tab";
      button.setAttribute("aria-pressed",String(name===activeTab));
      button.append(document.createTextNode(name));
      const count=document.createElement("span"); count.textContent=DATA[name].length.toLocaleString(); button.append(count);
      button.addEventListener("click",()=>{activeTab=name;clearEl.hidden=!searchEl.value;renderTabs();renderTable();scroller.scrollTo(0,0);});
      tabsEl.append(button);
    });
  }

  function addCell(row,text,tag="td",className=""){
    const cell=document.createElement(tag); cell.textContent=text||""; if(className)cell.className=className; row.append(cell); return cell;
  }

  function renderTable(){
    const query=searchEl.value.trim().toLocaleLowerCase("ko-KR");
    const source=DATA[activeTab];
    const rows=query?source.filter(row=>[row.category,row.classification,row.name,row.effect,...row.items].join(" ").toLocaleLowerCase("ko-KR").includes(query)):source;
    const maxItems=(activeTab==="아이템"||activeTab==="변신")?7:5;
    resultEl.textContent=rows.length.toLocaleString(); allEl.textContent=` / ${source.length.toLocaleString()}개`;
    const table=document.createElement("table");
    const thead=document.createElement("thead"), headRow=document.createElement("tr");
    addCell(headRow,"효과","th","sticky-name effect-col"); addCell(headRow,"컬렉션 이름","th");
    for(let i=1;i<=maxItems;i++)addCell(headRow,`등록${activeTab} ${i}`,"th");
    addCell(headRow,activeTab==="아이템"?"구분":"서버 제한","th");
    if(activeTab==="아이템")addCell(headRow,"등급/분류","th");
    thead.append(headRow); table.append(thead);
    const tbody=document.createElement("tbody");
    rows.forEach(row=>{
      const tr=document.createElement("tr");
      addCell(tr,row.effect||"–","td","sticky-name effect-cell"); addCell(tr,row.name,"td","name-cell");
      for(let i=0;i<maxItems;i++)addCell(tr,row.items[i]||"");
      addCell(tr,activeTab==="아이템"?row.category:row.classification);
      if(activeTab==="아이템")addCell(tr,row.classification);
      tbody.append(tr);
    });
    if(!rows.length){const tr=document.createElement("tr"),td=addCell(tr,`“${searchEl.value}”와 일치하는 컬렉션이 없습니다.`,`td`,`empty-result`);td.colSpan=maxItems+(activeTab==="아이템"?4:3);tbody.append(tr);}
    table.append(tbody); scroller.replaceChildren(table);
  }

  let frame=0;
  searchEl.addEventListener("input",()=>{clearEl.hidden=!searchEl.value;cancelAnimationFrame(frame);frame=requestAnimationFrame(renderTable);});
  clearEl.addEventListener("click",()=>{searchEl.value="";clearEl.hidden=true;renderTable();searchEl.focus();});

  let drag=null;
  scroller.addEventListener("pointerdown",event=>{if(event.pointerType!=="mouse"||event.button!==0)return;drag={x:event.clientX,y:event.clientY,left:scroller.scrollLeft,top:scroller.scrollTop};scroller.setPointerCapture(event.pointerId);scroller.classList.add("dragging");});
  scroller.addEventListener("pointermove",event=>{if(!drag)return;scroller.scrollLeft=drag.left-(event.clientX-drag.x);scroller.scrollTop=drag.top-(event.clientY-drag.y);});
  const stopDrag=()=>{drag=null;scroller.classList.remove("dragging");};
  scroller.addEventListener("pointerup",stopDrag);scroller.addEventListener("pointercancel",stopDrag);

  renderTabs(); renderTable();
  </script>
