<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#185b3c">
  <title>리니지M 컬렉션 검색</title>
  <style>

:root {
  --ink: #172019;
  --muted: #657067;
  --paper: #f6f7f2;
  --panel: #ffffff;
  --line: #dfe5dc;
  --green: #185b3c;
  --green-dark: #0f432c;
  --green-soft: #e7f1e9;
  --gold: #e7b947;
  --select-col-width: 40px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  overscroll-behavior: none;
}

button, input { font: inherit; }

.app-shell {
  height: 100dvh;
  min-height: 480px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-panel {
  flex: 0 0 auto;
  padding: 18px clamp(14px, 3vw, 34px) 12px;
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(31, 56, 40, 0.08);
  z-index: 10;
}

.title-row, .search-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.eyebrow {
  margin: 0 0 2px;
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.13em;
}

h1 {
  margin: 0;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: clamp(22px, 4vw, 34px);
  line-height: 1.15;
  letter-spacing: -0.04em;
}

/* --- 추가: 선택된 능력치 합계 공간 스타일 --- */
.stats-summary-container {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 400px;
  overflow-x: auto;
  padding: 4px 8px;
  background: #f0f4f1;
  border: 1px solid #c8d6cb;
  border-radius: 8px;
  scrollbar-width: none;
}

.stats-summary-container::-webkit-scrollbar {
  display: none;
}

.stats-summary-empty {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}

.stats-chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.stats-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #ffffff;
  border: 1px solid #b2c8b8;
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--green-dark);
  white-space: nowrap;
}

.stats-chip .val {
  color: #c82323;
  font-weight: 800;
}
/* ------------------------------------------- */

.total-badge {
  flex: 0 0 auto;
  padding: 7px 10px;
  border: 1px solid #c9d4c9;
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.title-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.title-main {
  min-width: 0;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
}

.action-button {
  padding: 7px 11px;
  border: 1px solid #c9d4c9;
  border-radius: 999px;
  background: #fff;
  color: #405047;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.action-button:hover { border-color: var(--green); color: var(--green); }
.action-button.primary { border-color: var(--green); background: var(--green); color: #fff; }
.action-button.danger { color: #9c4038; }

#status-toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 50;
  transform: translateX(-50%) translateY(10px);
  padding: 9px 16px;
  border-radius: 999px;
  background: #173c29;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transition: 160ms ease;
}

#status-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.tabs {
  display: flex;
  gap: 7px;
  margin: 14px 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  min-width: 88px;
  padding: 10px 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid #cfd8cf;
  border-radius: 12px;
  background: #fff;
  color: #4f5c52;
  font-weight: 800;
  cursor: pointer;
  transition: 160ms ease;
}

.tab span {
  padding: 2px 6px;
  border-radius: 999px;
  background: #eef1ed;
  font-size: 10px;
}

.tab.active {
  border-color: var(--green);
  background: var(--green);
  color: #fff;
  box-shadow: 0 5px 16px rgba(24, 91, 60, 0.2);
}

.tab.active span { background: rgba(255, 255, 255, 0.18); }

.search-box {
  height: 46px;
  flex: 1 1 520px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  border: 2px solid var(--green);
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 4px 16px rgba(23, 70, 47, 0.08);
}

.search-box > span {
  color: var(--green);
  font-size: 27px;
  line-height: 1;
  transform: rotate(-15deg);
}

.search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
}

.search-box input::placeholder { color: #919b93; }

.search-box button {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: #eef2ed;
  color: #586259;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.result-count {
  flex: 0 0 auto;
  min-width: 98px;
  text-align: right;
  color: var(--muted);
  font-size: 13px;
}

.result-count strong { color: var(--green); font-size: 20px; }

.drag-hint {
  margin: 7px 2px 0;
  color: var(--muted);
  font-size: 11px;
}

.table-scroller {
  flex: 1 1 auto;
  min-height: 0;
  margin: 12px clamp(10px, 2vw, 24px) 14px;
  overflow: auto;
  touch-action: pan-x pan-y;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  cursor: grab;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: 0 12px 32px rgba(25, 49, 33, 0.08);
}

.table-scroller.dragging { cursor: grabbing; user-select: none; }

table {
  width: max-content;
  min-width: 0;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

th, td {
  min-width: 85px;
  max-width: 115px;
  padding: 8px 7px;
  text-align: left;
  vertical-align: middle;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  white-space: normal;
  word-break: keep-all;
}

.cell-text {
  display: -webkit-box;
  overflow: hidden;
  line-height: 1.35;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: keep-all;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--green-dark);
  color: #fff;
  font-size: 12px;
  letter-spacing: -0.02em;
}

tbody td { background: #fff; }
tbody tr:hover td { background: #fff; }

.grade-bg-1 td { background: #fff; }
.grade-bg-2 td { background: #e6f4ea; }
.grade-bg-3 td { background: #e6f0ff; }
.grade-bg-4 td { background: #ffe8e8; }
.grade-bg-5 td { background: #f0e7ff; }
.grade-bg-6 td { background: #fff6c7; }
.grade-bg-7 td { background: #e9f8cf; }

tbody tr.row-checked td {
  background: #fff0a6 !important;
  border-bottom-color: #e6bd3c;
}

tbody tr.row-checked td.select-col { box-shadow: inset 4px 0 0 #d99d00; }

.grade-text-1 { color: #363636; }
.grade-text-2 { color: #15a537; }
.grade-text-3 { color: #1d6aea; }
.grade-text-4 { color: #d40f00; }
.grade-text-5 { color: #701caa; }
.grade-text-6 { color: #eda900; }
.grade-text-7 { color: #0fd89a; }

.select-col {
  position: sticky;
  left: 0;
  width: var(--select-col-width);
  min-width: var(--select-col-width);
  max-width: var(--select-col-width);
  padding-left: 4px;
  padding-right: 4px;
  text-align: center;
  z-index: 4;
}

th.select-col { z-index: 6; background: #082c1d; }
.row-check { width: 18px; height: 18px; margin: 0; accent-color: var(--green); cursor: pointer; }

.sticky-name {
  position: sticky;
  left: var(--select-col-width);
  min-width: 110px;
  max-width: 135px;
  z-index: 2;
  box-shadow: 8px 0 14px -14px rgba(13, 37, 23, 0.8);
}

th.sticky-name { z-index: 5; background: #0b3624; }
.name-cell { font-weight: 800; color: #172a1d; }
.effect-col, .effect-cell { min-width: 110px; max-width: 135px; }
.effect-cell { color: #0d5535; font-weight: 750; }

.state-message {
  height: 100%;
  min-height: 240px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-weight: 700;
}

.state-message.error { color: #a23e35; }

.empty-result {
  padding: 42px;
  text-align: center;
  color: var(--muted);
}

@media (max-width: 640px) {
  :root { --select-col-width: 32px; }
  .top-panel { padding: 12px 12px 9px; }
  .eyebrow { font-size: 9px; }
  .total-badge { display: none; }
  .title-row { align-items: flex-start; gap: 8px; }
  .title-actions { gap: 4px; }
  .action-button { padding: 6px 7px; border-radius: 8px; font-size: 11px; }
  .tabs { margin: 10px 0 9px; gap: 6px; }
  .tab { min-width: 78px; padding: 8px 10px; border-radius: 10px; font-size: 13px; }
  .search-row { gap: 8px; }
  .search-box { height: 42px; border-radius: 11px; }
  .search-box input { font-size: 14px; }
  .result-count { min-width: 70px; font-size: 11px; }
  .result-count strong { display: block; font-size: 17px; line-height: 1; }
  .drag-hint { margin-top: 5px; }
  .table-scroller { margin: 8px 7px 7px; border-radius: 11px; }
  table { table-layout: fixed; }
  th, td {
    width: 45px;
    min-width: 45px;
    max-width: 45px;
    padding: 6px 4px;
    font-size: 12px;
    line-height: 1.35;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .sticky-name {
    width: 45px;
    min-width: 45px;
    max-width: 45px;
    word-break: keep-all;
  }
  .effect-col, .effect-cell {
    width: 45px;
    min-width: 45px;
    max-width: 45px;
    word-break: keep-all;
  }
  .select-col {
    width: var(--select-col-width);
    min-width: var(--select-col-width);
    max-width: var(--select-col-width);
    padding-left: 2px;
    padding-right: 2px;
  }
  .row-check { width: 16px; height: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
  <main class="app-shell">
    <header class="top-panel">
      <div class="title-row">
        <div class="title-main">
          <div><p class="eyebrow">LINEAGE M COLLECTION</p><h1>리니지M 컬렉션 검색</h1></div>
          
          <!-- 제목 우측: 체크된 능력치 합산 공간 -->
          <div class="stats-summary-container" id="statsSummary">
            <span class="stats-summary-empty">체크된 항목 없음</span>
          </div>

          <div class="title-actions">
            <button class="action-button primary" id="saveChecks" type="button">저장</button>
            <button class="action-button" id="loadChecks" type="button">불러오기</button>
            <button class="action-button danger" id="resetChecks" type="button">초기화</button>
          </div>
        </div>
        <span class="total-badge" id="totalBadge"></span>
      </div>
      <nav class="tabs" id="tabs" aria-label="컬렉션 종류"></nav>
      <div class="search-row">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search" placeholder="이름, 효과, 등록 대상 검색" aria-label="컬렉션 검색" autocomplete="off">
          <button id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
        </label>
        <div class="result-count" aria-live="polite"><strong id="resultCount">0</strong><span id="allCount"></span></div>
      </div>
      <p class="drag-hint">표를 손가락으로 상하좌우 밀어서 이동하세요.</p>
    </header>
    <section class="table-scroller" id="scroller" aria-label="컬렉션 표"></section>
  </main>
  <div id="status-toast" role="status" aria-live="polite"></div>

  const STORAGE_KEY = 'lineageM_checked_collections_v1';

  const listWithId = rawList.map((item, idx) => ({

  const totalBadge = document.getElementById('totalBadge');
  const toast = document.getElementById('status-toast');
  const statsSummaryEl = document.getElementById('statsSummary');

  const gradeMap = { '일반': 1, '고급': 2, '희귀': 3, '영웅': 4, '전설': 5, '신화': 6, '유일': 7 };
  const classifications = ['전체', ...Array.from(new Set(listWithId.map(i => i.classification)))];

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function updateBadge() {
    totalBadge.textContent = `선택 ${checkedItems.size} / 전체 ${listWithId.length}`;
  }

  // --- 추가: 체크된 항목의 능력치 합산 함수 ---
  function updateStatsSummary() {
    if (checkedItems.size === 0) {
      statsSummaryEl.innerHTML = '<span class="stats-summary-empty">체크된 항목 없음</span>';
      return;
    }

    const numStats = {};
    const textStats = new Set();

    listWithId.forEach(item => {
      if (checkedItems.has(item.id) && item.effect) {
        // 공백으로 단어 분리 (단, %나 수치가 포함된 옵션 구분)
        // 예: "Max HP +50", "AC -1", "경험치 획득량 증가 +0.1%"
        const effectParts = item.effect.split(/(?<=[%\d])\s+/);
        
        effectParts.forEach(part => {
          part = part.trim();
          if (!part) return;

          // 정규식: "옵션명 (+|-|)(숫자)(%|)" 형식 매칭
          const match = part.match(/^(.+?)\s*([\+\-]?\d+(?:\.\d+)?)(%?)$/);
          if (match) {
            const key = match[1].trim() + (match[3] ? '%' : '');
            const val = parseFloat(match[2]);
            numStats[key] = (numStats[key] || 0) + val;
          } else {
            textStats.add(part);
          }
        });
      }
    });

    const chipHtml = [];

    // 수치형 옵션 추가
    Object.keys(numStats).forEach(key => {
      let val = numStats[key];
      val = Math.round(val * 100) / 100; // 소수점 반올림 처리
      const isPercent = key.endsWith('%');
      const cleanKey = isPercent ? key.slice(0, -1) : key;
      const sign = val > 0 ? '+' : '';
      chipHtml.push(`
        <li class="stats-chip">
          <span>${cleanKey}</span>
          <span class="val">${sign}${val}${isPercent ? '%' : ''}</span>
        </li>
      `);
    });

    // 텍스트형 옵션 추가 (예: 죽음 +1)
    textStats.forEach(text => {
      chipHtml.push(`
        <li class="stats-chip">
          <span>${text}</span>
        </li>
      `);
    });

    if (chipHtml.length === 0) {
      statsSummaryEl.innerHTML = '<span class="stats-summary-empty">체크된 항목 없음</span>';
    } else {
      statsSummaryEl.innerHTML = `<ul class="stats-chip-list">${chipHtml.join('')}</ul>`;
    }
  }

  function renderTabs() {
    tabsContainer.innerHTML = classifications.map(cls => {
      const count = cls === '전체' 
        ? listWithId.length 
        : listWithId.filter(i => i.classification === cls).length;
      return `<button class="tab ${cls === currentTab ? 'active' : ''}" data-tab="${cls}">${cls}<span>${count}</span></button>`;
    }).join('');
  }

  function filterData() {
    return listWithId.filter(item => {
      if (currentTab !== '전체' && item.classification !== currentTab) return false;
      if (!searchKeyword) return true;
      const k = searchKeyword.toLowerCase();
      return item.name.toLowerCase().includes(k) ||
             (item.effect && item.effect.toLowerCase().includes(k)) ||
             (item.items && item.items.some(i => i.toLowerCase().includes(k)));
    });
  }

  function renderTable() {
    const list = filterData();
    resultCountEl.textContent = list.length;
    allCountEl.textContent = `/ ${listWithId.length}`;

    if (list.length === 0) {
      scroller.innerHTML = '<div class="empty-result">검색 결과가 없습니다.</div>';
      return;
    }

    const maxItems = Math.max(...list.map(i => i.items ? i.items.length : 0), 1);

    let html = '<table><thead><tr>';
    html += '<th class="select-col">선택</th>';
    html += '<th class="sticky-name">컬렉션명</th>';
    html += '<th class="effect-col">효과</th>';
    for (let i = 1; i <= maxItems; i++) {
      html += `<th>아이템 ${i}</th>`;
    }
    html += '</tr></thead><tbody>';

    list.forEach(item => {
      const isChecked = checkedItems.has(item.id);
      const gradeClass = gradeMap[item.classification] ? `grade-bg-${gradeMap[item.classification]}` : '';
      const textGradeClass = gradeMap[item.classification] ? `grade-text-${gradeMap[item.classification]}` : '';

      html += `<tr class="${gradeClass} ${isChecked ? 'row-checked' : ''}" data-id="${item.id}">`;
      html += `<td class="select-col"><input type="checkbox" class="row-check" data-id="${item.id}" ${isChecked ? 'checked' : ''} aria-label="${item.name} 선택"></td>`;
      html += `<td class="sticky-name name-cell ${textGradeClass}"><div class="cell-text">${item.name}</div></td>`;
      html += `<td class="effect-cell"><div class="cell-text">${item.effect || ''}</div></td>`;

      for (let i = 0; i < maxItems; i++) {
        const it = (item.items && item.items[i]) ? item.items[i] : '';
        html += `<td><div class="cell-text">${it}</div></td>`;
      }
      html += '</tr>';
    });

    html += '</tbody></table>';
    scroller.innerHTML = html;
    updateBadge();
    updateStatsSummary();
  }

  tabsContainer.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    currentTab = btn.dataset.tab;
    renderTabs();
    renderTable();
  });

  searchInput.addEventListener('input', e => {
    searchKeyword = e.target.value.trim();
    clearBtn.hidden = !searchKeyword;
    renderTable();
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchKeyword = '';
    clearBtn.hidden = true;
    renderTable();
  });

  scroller.addEventListener('change', e => {
    if (e.target.classList.contains('row-check')) {
      const id = e.target.dataset.id;
      const tr = e.target.closest('tr');
      if (e.target.checked) {
        checkedItems.add(id);
        if (tr) tr.classList.add('row-checked');
      } else {
        checkedItems.delete(id);
        if (tr) tr.classList.remove('row-checked');
      }
      updateBadge();
      updateStatsSummary();
    }
  });

  document.getElementById('saveChecks').addEventListener('click', () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(checkedItems)));

  });

  document.getElementById('loadChecks').addEventListener('click', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      checkedItems = new Set(JSON.parse(saved));
      renderTable();
      showToast('저장된 데이터를 불러왔습니다.');

      showToast('저장된 데이터가 없습니다.');

  document.getElementById('resetChecks').addEventListener('click', () => {
    if (confirm('모든 선택 상태를 초기화하시겠습니까?')) {
      checkedItems.clear();
      localStorage.removeItem(STORAGE_KEY);

  // 테이블 드래그 이동 (Touch / Mouse)
  let isDown = false;
  let startX, startY, scrollLeft, scrollTop;

  scroller.addEventListener('mousedown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    isDown = true;
    scroller.classList.add('dragging');
    startX = e.pageX - scroller.offsetLeft;
    startY = e.pageY - scroller.offsetTop;
    scrollLeft = scroller.scrollLeft;
    scrollTop = scroller.scrollTop;
  });

  scroller.addEventListener('mouseleave', () => {
    isDown = false;
    scroller.classList.remove('dragging');
  });

  scroller.addEventListener('mouseup', () => {
    isDown = false;
    scroller.classList.remove('dragging');
  });

  scroller.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - scroller.offsetLeft;
    const y = e.pageY - scroller.offsetTop;
    const walkX = (x - startX) * 1.5;
    const walkY = (y - startY) * 1.5;
    scroller.scrollLeft = scrollLeft - walkX;
    scroller.scrollTop = scrollTop - walkY;
  });

  // 초기화 실행
  renderTabs();
  renderTable();
  </script>
</body>
</html>
